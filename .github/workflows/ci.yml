name: CI

# What CI can and cannot verify for Loreframe Lab
# ------------------------------------------------
# Loreframe Lab is a local-first GPU app. Its two runtime behaviours —
# diffusion/video generation and Director LLM planning — CANNOT run here:
#   * generation needs an NVIDIA GPU (CI runners are CPU-only), and
#   * the planners talk to a local llama-server / external LLM that isn't here.
#
# So CI never generates media or calls a real model. It runs the parts that
# are meaningful on a CPU box with no weights and no LLM:
#   * deterministic repo guards (clean-repo boundary, dependency/brand/docs
#     contracts) — the clean-repo guard is the important one for a public
#     repo: it fails if mature/explicit prose or locally-generated model
#     guides ever leak into tracked source (see scripts/verify_clean_repo.py),
#   * a Python syntax check of the modules we edit,
#   * the CPU test suite (tests/) — these drive the generation/Director logic
#     with stubbed model/LLM calls and tiny fixtures; any case that truly
#     needs a GPU or model self-skips (skipUnless _requires_torch, etc.), and
#   * the React/TypeScript UI: tests, eslint (zero warnings), type-check,
#     build and bundle budget.
#
# The Python dependency list lives in tests/requirements-cpu.txt so CI and the
# Cloud Agent dev environment (.cursor/install.sh) install exactly the same
# CPU-only subset of app/requirements.txt (no CUDA-only wheels).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Clean-repo guard + Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tests/requirements-cpu.txt

      # Cheap, dependency-free guards first so obvious breakage fails fast.
      - name: Clean-repo boundary guard
        run: python scripts/verify_clean_repo.py
      - name: Dependency install/update contract smoke
        run: python scripts/check_dependency_contract.py
      - name: Documentation links and drift
        run: python scripts/check_documentation_links.py
      - name: Visible brand and compatibility contract
        run: python scripts/check_brand_contract.py
      - name: Python syntax check (our modules)
        # compileall only compiles (never imports), so it needs no deps and
        # skips heavy vendored model code. Covers the surface we edit.
        run: python -m compileall -q app/services app/launch.py scripts

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-cpu.txt
      - name: Install CPU tensor runtime (no CUDA on CI runners)
        run: >-
          pip install
          "torch==2.7.0"
          "torchaudio==2.7.0"
          "torchvision==0.22.0"
          --index-url https://download.pytorch.org/whl/cpu

      - name: Pytest collection
        run: python -m pytest --collect-only -q
      - name: Python test suite
        # ffmpeg is preinstalled on ubuntu-latest; media tests use it and any
        # GPU/model-only case self-skips.
        run: python -m pytest -q

  ui-check:
    name: UI tests + lint + type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        working-directory: ui
        run: npm ci
      - name: Test, lint with zero warnings, type-check, build and bundle budget
        working-directory: ui
        run: npm run check
