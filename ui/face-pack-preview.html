<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>if (/[?&]video=1/.test(location.search)) document.documentElement.classList.add('video')</script>
    <title>Experimental face pack lipsync</title>
    <style>
      body { margin: 0; background: #0b0d14; color: #f4efe6; font: 14px/1.4 sans-serif; }
      header { padding: 12px 16px 8px; }
      header h1 { margin: 0 0 6px; font-size: 18px; }
      header p { margin: 0; color: #b7c0cc; }
      #strip { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 12px; }
      #strip button { min-height: 36px; border: 1px solid #2a3344; background: #151822; color: #f4efe6; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
      #strip button[aria-pressed="true"] { border-color: #7ad7ff; background: #163044; }
      #view { width: min(1280px, 100%); height: min(720px, 56vw); margin: 0 16px 12px; background: #10141c; border-radius: 12px; overflow: hidden; }
      #atlas { display: flex; flex-wrap: wrap; gap: 16px; padding: 0 16px 16px; align-items: flex-start; }
      #atlas img { max-width: min(560px, 100%); border-radius: 8px; background: #10141c; }
      #status { color: #9ad7ff; }
      html.video, body.video { overflow: hidden; background: #10131c; }
      html.video header, html.video #strip, html.video #atlas, html.video #videos, html.video #voice,
      body.video header, body.video #strip, body.video #atlas, body.video #videos { display: none !important; }
      html.video #view, body.video #view { position: fixed; inset: 0; margin: 0; border-radius: 0; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <header>
      <h1>Experimental mascot lipsync</h1>
      <p id="caption">Loading…</p>
      <p id="status"></p>
    </header>
    <div id="strip"></div>
    <div id="view"></div>
    <audio id="voice" src="/examples/face-pack/neutral-vowels.wav" loop></audio>
    <div id="atlas"></div>
    <section id="videos" style="padding:0 16px 24px">
      <h2 style="font-size:16px">Video previews</h2>
      <p style="color:#b7c0cc">8 s each, synthetic vowels. Hangar/sea keep CRT + skull; roof is the cube-head and voxel skull.</p>
      <div style="display:flex;flex-wrap:wrap;gap:16px">
        <figure>
          <video src="/examples/face-pack/hangar-talk.mp4" controls playsinline width="420"></video>
          <figcaption>Hangar talk</figcaption>
        </figure>
        <figure>
          <video src="/examples/face-pack/sea-talk.mp4" controls playsinline width="420"></video>
          <figcaption>Sea talk</figcaption>
        </figure>
        <figure>
          <video src="/examples/face-pack/voxel-talk.mp4" controls playsinline width="420"></video>
          <figcaption>Voxel talk</figcaption>
        </figure>
        <figure>
          <video src="/examples/face-pack/felt-talk.mp4" controls playsinline width="420"></video>
          <figcaption>Felt + clay</figcaption>
        </figure>
        <figure>
          <video src="/examples/face-pack/pumpkin-talk.mp4" controls playsinline width="420"></video>
          <figcaption>Pumpkin + oni</figcaption>
        </figure>
        <figure>
          <video src="/examples/face-pack/cat-talk.mp4" controls playsinline width="420"></video>
          <figcaption>Cat + alien</figcaption>
        </figure>
      </div>
    </section>
    <script type="module" src="/face-pack-preview.ts"></script>
  </body>
</html>
