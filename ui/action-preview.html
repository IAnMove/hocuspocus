<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>if (/[?&]video=1/.test(location.search)) document.documentElement.classList.add('video')</script>
    <title>Action cinema sets</title>
    <style>
      body { margin: 0; background: #0b0d14; color: #f4efe6; font: 14px/1.4 sans-serif; }
      header { padding: 12px 16px 8px; }
      header h1 { margin: 0 0 6px; font-size: 18px; }
      header p { margin: 0; color: #b7c0cc; }
      #strip { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px 12px; }
      #strip button { min-height: 36px; border: 1px solid #2a3344; background: #151822; color: #f4efe6; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
      #strip button[aria-pressed="true"] { border-color: #7ad7ff; background: #163044; }
      #view { width: min(1280px, 100%); height: min(720px, 56vw); margin: 0 16px 16px; background: #10141c; border-radius: 12px; overflow: hidden; }
      html.video, body.video { overflow: hidden; background: #10131c; }
      html.video header, html.video #strip, body.video header, body.video #strip { display: none !important; }
      html.video #view, body.video #view { position: fixed; inset: 0; margin: 0; border-radius: 0; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <header>
      <h1>Action cinema sets</h1>
      <p id="caption">Loading…</p>
    </header>
    <div id="strip"></div>
    <div id="view"></div>
    <script type="module" src="/action-preview.ts"></script>
  </body>
</html>
